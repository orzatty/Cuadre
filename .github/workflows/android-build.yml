name: Android Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ---- Workers API Deployment ----
  deploy-api:
    name: Deploy Workers API
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./workers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers

      - name: Run D1 Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers
          command: d1 execute cuadre-db --file=src/db/schema.sql

  # ---- Android Build ----
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Initialize Android Project
        run: cargo tauri android init

      - name: Build Android APK
        run: cargo tauri android build --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Sign Android APK
        run: |
          # 1. Generate a keystore dynamically if not already provided
          keytool -genkeypair -v -keystore release.keystore -alias cuadre -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=cuadre.app, OU=Cuadre, O=Cuadre, L=Caracas, S=DF, C=VE" -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'cuadre123' }} -keypass ${{ secrets.ANDROID_KEY_PASSWORD || 'cuadre123' }}

          # 2. Find apksigner tool dynamically in Android SDK build-tools
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner: $APKSIGNER"

          # 3. Find the compiled unsigned release APK
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk/ -name "*-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found unsigned APK: $UNSIGNED_APK"

          # 4. Sign the APK
          $APKSIGNER sign --ks release.keystore --ks-key-alias cuadre --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'cuadre123' }} --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD || 'cuadre123' }} --out src-tauri/gen/android/app/build/outputs/apk/release/app-release-signed.apk "$UNSIGNED_APK"
          echo "APK successfully signed!"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuadre-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  # ---- Release ----
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy-api, build-android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: cuadre-android-apk
          path: ./apk

      - name: Get version
        id: version
        run: echo "version=$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Cuadre ${{ steps.version.outputs.version }}
          body: |
            Cuadre release ${{ steps.version.outputs.version }}
            
            **Changes:** ${{ github.event.head_commit.message }}
          files: ./apk/**/*.apk
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
